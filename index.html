<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chatbot</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        transition: 0.3s;
    }

    body.dark { background: #1e1e1e; color: white; }

    #chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: 0.3s;
    }

    .msg {
        max-width: 70%;
        padding: 12px 15px;
        border-radius: 15px;
        line-height: 1.4;
        font-size: 15px;
        animation: fadein 0.3s ease-in;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .user { background: #0078ff; color: white; align-self: flex-end; }
    .bot { background: #e1e1e1; color: black; align-self: flex-start; }
    body.dark .bot { background: #333; color: white; }

    #inputArea {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        transition: 0.3s;
    }

    body.dark #inputArea { background: #2b2b2b; border-color: #444; }

    #msgInput {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    #sendBtn, #darkBtn {
        margin-left: 10px;
        padding: 10px 18px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
    }

    #sendBtn { background: #0078ff; }
    #darkBtn { background: #444; }

    #typing {
        font-style: italic;
        opacity: 0.7;
        display: none;
        margin-left: 20px;
    }
</style>
</head>

<body>

<div id="chatbox"></div>
<div id="typing">Bot is typing...</div>

<div id="inputArea">
    <input id="msgInput" placeholder="Type a message..." />
    <button id="sendBtn" onclick="send()">Send</button>
    <button id="darkBtn" onclick="toggleDark()">🌙</button>
</div>

<script>

const API_URL = "https://your-render-url.onrender.com/chat";
window.onload = () => {
    let history = JSON.parse(localStorage.getItem("chatHistory")) || [];
    history.forEach(msg => addMessage(msg.text, msg.sender, false));
};

function saveHistory(text, sender) {
    let history = JSON.parse(localStorage.getItem("chatHistory")) || [];
    history.push({ text, sender });
    localStorage.setItem("chatHistory", JSON.stringify(history));
}

async function send() {
    let msg = document.getElementById("msgInput").value;
    if (!msg.trim()) return;

    addMessage(msg, "user");
    saveHistory(msg, "user");

    document.getElementById("msgInput").value = "";
    document.getElementById("typing").style.display = "block";

    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    document.getElementById("typing").style.display = "none";

    addMessage(data.reply, "bot");
    saveHistory(data.reply, "bot");
}

function addMessage(text, sender, scroll = true) {
    let div = document.createElement("div");
    div.classList.add("msg", sender);
    div.innerText = text;
    document.getElementById("chatbox").appendChild(div);

    if (scroll) {
        document.getElementById("chatbox").scrollTop =
            document.getElementById("chatbox").scrollHeight;
    }
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
